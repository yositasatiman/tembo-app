name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tembo
          POSTGRES_PASSWORD: tembo
          POSTGRES_DB: tembo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tembo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tembo:tembo@localhost:5432/tembo
      JWT_SECRET: ci-jwt-secret
      OTP_SECRET: ci-otp-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm --filter @tembo/api build
      - run: pnpm --filter @tembo/web build
