# Render Blueprint — TEMBO API (NestJS) บนแพ็กเกจฟรี
# วิธีใช้: Render → New → Blueprint → เลือก repo นี้ (ดู docs/deploy.md)
services:
  - type: web
    name: tembo-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm build:packages &&
      pnpm db:deploy &&
      pnpm db:seed &&
      pnpm --filter @tembo/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # ใส่ connection string จาก Neon
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false          # URL หน้าเว็บบน Vercel เช่น https://tembo-app.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      # Render ฟรีบล็อกพอร์ต SMTP → ส่งอีเมลผ่าน Google Apps Script (docs/gmail-relay.gs)
      - key: MAIL_WEBHOOK_URL
        sync: false          # URL ของ Web app จาก Apps Script (ลงท้าย /exec)
      - key: MAIL_WEBHOOK_SECRET
        generateValue: true  # คัดลอกค่านี้ไปใส่ Script Properties ชื่อ SECRET
      - key: MAIL_FROM
        sync: false          # เช่น TEMBO <yourgmail@gmail.com>
      - key: ADMIN_EMAILS
        sync: false          # อีเมลแอดมิน คั่นด้วย ,
